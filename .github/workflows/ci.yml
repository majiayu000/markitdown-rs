name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The Python module (crates/markitdown-py) is outside the workspace:
  # building it needs Python and maturin.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\ncrates/markitdown-py -> target"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.21"
      - run: cargo fmt --check
        working-directory: crates/markitdown-py
      - run: cargo clippy --locked -- -D warnings
        working-directory: crates/markitdown-py
      # the tests compare the module with the CLI
      - run: cargo build --release --locked -p markitdown-rs
      - run: |
          uv venv .venv
          VIRTUAL_ENV=$PWD/.venv uv pip install maturin pytest
          VIRTUAL_ENV=$PWD/.venv .venv/bin/maturin develop --release --uv
        working-directory: crates/markitdown-py
      - run: crates/markitdown-py/.venv/bin/pytest crates/markitdown-py/tests

  # The checked-in snapshots must be exactly what the pinned Python
  # markitdown (oracle/uv.lock) prints today.
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.21"
      - run: scripts/gen_snapshots.sh
      - run: uv run --project oracle --frozen python scripts/gen_url_snapshots.py
      - uses: actions/checkout@v4
        with:
          repository: html5lib/html5lib-tests
          ref: c777c408b61078ea2eb4acefc2535f54dbc8b28a
          path: html5lib-tests
      - run: uv run --project oracle --frozen python scripts/gen_html_cases.py html5lib-tests
      - run: git status --porcelain tests && test -z "$(git status --porcelain tests)"
