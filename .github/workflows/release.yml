name: Release

# Builds the `markitdown` binary for each target when a GitHub release is
# published and attaches the archives (with SHA-256 sums) to it.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p markitdown-rs --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=markitdown-${{ github.event.release.tag_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/markitdown LICENSE README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/markitdown tests/fixtures/docx/markitdown-test.docx | head -5
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" "$ASSET.sha256" --clobber
