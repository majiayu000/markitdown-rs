[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "markitdown-rs"
description = "Microsoft's markitdown Python API backed by Rust: same `markitdown` module, same Markdown output, no heavy dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
  "markitdown",
  "markitdown-alternative",
  "markdown",
  "pdf-to-markdown",
  "docx-to-markdown",
  "document-conversion",
  "llm",
  "rag",
  "mcp",
]
# no License classifier: `license` is an SPDX expression (PEP 639), which
# PyPI does not accept together with one
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: General",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dynamic = ["version"]

# markitdown 0.1.9's extras that pull in Python packages. Its other format
# extras (pdf, pptx, ...) are empty here: those converters are built in.
[project.optional-dependencies]
audio-transcription = [
  "pydub",
  "speechrecognition",
  # pydub imports audioop, which Python 3.13 removed
  "audioop-lts; python_version >= '3.13'",
]
youtube-transcription = ["youtube-transcript-api~=1.2.3"]
az-doc-intel = ["azure-ai-documentintelligence", "azure-identity"]
az-content-understanding = ["azure-ai-contentunderstanding>=1.2.0b1", "azure-identity"]
# markitdown-ocr 0.1.2's dependencies without markitdown itself, which
# would overwrite this package: install the plugin with --no-deps
ocr = [
  "mammoth<2,>=1.12.2",
  "openpyxl",
  "pandas",
  "pdfminer-six>=20251230",
  "pdfplumber>=0.11.9",
  "pillow>=12.1.1",
  "pymupdf<2,>=1.24.0",
  "python-docx",
  "python-pptx",
]
all = [
  "mammoth<2,>=1.12.2",
  "lxml",
  "beautifulsoup4",
  "defusedxml",
  "pydub",
  "speechrecognition",
  "audioop-lts; python_version >= '3.13'",
  "youtube-transcript-api~=1.2.3",
  "azure-ai-documentintelligence",
  "azure-ai-contentunderstanding>=1.2.0b1",
  "azure-identity",
]
# a style_map runs mammoth in Python, as markitdown does
docx = ["mammoth<2,>=1.12.2", "lxml", "beautifulsoup4", "defusedxml"]
pptx = []
xlsx = []
xls = []
pdf = []
outlook = []

[project.scripts]
markitdown = "markitdown.__main__:main"

[project.urls]
Homepage = "https://majiayu000.github.io/markitdown-rs/"
Documentation = "https://github.com/majiayu000/markitdown-rs/tree/main/crates/markitdown-py#readme"
Changelog = "https://github.com/majiayu000/markitdown-rs/releases"
Source = "https://github.com/majiayu000/markitdown-rs"
Issues = "https://github.com/majiayu000/markitdown-rs/issues"

[tool.maturin]
python-source = "python"
module-name = "markitdown._markitdown_rs"
features = ["pyo3/extension-module"]
# installed next to the markitdown package, where Microsoft's markitdown
# cannot overwrite them: a check that runs at start-up
# (sdist too: there pyproject.toml moves to the root, these paths with it)
include = [
  { path = "markitdown_rs.pth", format = ["sdist", "wheel"] },
  { path = "markitdown_rs_guard.py", format = ["sdist", "wheel"] },
]
