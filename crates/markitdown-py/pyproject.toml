[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "markitdown-rs"
description = "Microsoft's markitdown Python API backed by Rust: same `markitdown` module, same Markdown output, no heavy dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["markdown", "pdf", "docx", "llm", "rag"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dynamic = ["version"]

# markitdown 0.1.9's extras that pull in Python packages. Its format extras
# (docx, pdf, ...) are empty here: those converters are built in.
[project.optional-dependencies]
audio-transcription = [
  "pydub",
  "speechrecognition",
  # pydub imports audioop, which Python 3.13 removed
  "audioop-lts; python_version >= '3.13'",
]
youtube-transcription = ["youtube-transcript-api~=1.2.3"]
az-doc-intel = ["azure-ai-documentintelligence", "azure-identity"]
az-content-understanding = ["azure-ai-contentunderstanding>=1.2.0b1", "azure-identity"]
all = [
  "pydub",
  "speechrecognition",
  "audioop-lts; python_version >= '3.13'",
  "youtube-transcript-api~=1.2.3",
  "azure-ai-documentintelligence",
  "azure-ai-contentunderstanding>=1.2.0b1",
  "azure-identity",
]
docx = []
pptx = []
xlsx = []
xls = []
pdf = []
outlook = []

[project.scripts]
markitdown = "markitdown.__main__:main"

[project.urls]
Source = "https://github.com/majiayu000/markitdown-rs"

[tool.maturin]
python-source = "python"
module-name = "markitdown._markitdown_rs"
features = ["pyo3/extension-module"]
