requires-python = "==3.12.*"
dependencies = [
  "markitdown[docx,pptx]==0.1.8",
  "mammoth==1.11.0",
  "markdownify==1.2.3",
  "python-pptx==1.0.2",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "magika==0.6.3",
]

[dependency-groups]
fixtures = ["python-docx==1.2.0"]

[tool.uv]
package = false
