[package]
name = "markitdown-core"
description = "Office documents to Markdown, byte-for-byte compatible with Python markitdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aes = "0.8"
calamine = { version = "0.37", default-features = false }
cfb = "0.10"
chardetng = "0.1"
encoding_rs = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
md-5 = "0.10"
quick-xml = { version = "0.37.5", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1"
