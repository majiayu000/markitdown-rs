[workspace]
resolver = "3"
members = ["crates/markitdown-core", "crates/markitdown-rs"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/majiayu000/markitdown-rs"
homepage = "https://majiayu000.github.io/markitdown-rs/"
authors = ["majiayu000 <1835304752@qq.com>"]

[workspace.dependencies]
markitdown-core = { path = "crates/markitdown-core", version = "0.2.0" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
