[project]
name = "markitdown-oracle"
version = "0"
description = "Pinned Python markitdown used to generate reference snapshots"
requires-python = "==3.12.*"
dependencies = [
  "markitdown[docx,pptx,xlsx,xls,pdf,outlook]==0.1.9",
  "mammoth==1.13.0",
  "markdownify==1.2.3",
  "python-pptx==1.0.2",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "magika==0.6.3",
  "pandas==3.0.6",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "pdfminer.six==20260107",
  "pdfplumber==0.11.10",
  "olefile==0.47",
]

[dependency-groups]
fixtures = ["python-docx==1.2.0"]

[tool.uv]
package = false
